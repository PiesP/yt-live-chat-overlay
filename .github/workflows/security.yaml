name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch: pinned-tool freshness + OSV full scan + CodeQL + Semgrep secrets
# - PR/merge queue: OSV gate + CodeQL + Semgrep secrets
# - PR gate: OSV diff scan; merge queue: full OSV scan
# - Scheduled/manual diagnostics: pinned-tool freshness, full OSV scan, and full Semgrep SARIF
#
# Full Semgrep source analysis runs on the weekly schedule or manually; the
# required PR check retains secrets coverage on every relevant change.
#
# Trigger: Push/PR to master + merge queue + weekly schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * 0" # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

jobs:
  pin-metadata:
    name: Resolve reviewed scanner images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      OSV_SCANNER_IMAGE: ${{ steps.pins.outputs.OSV_SCANNER_IMAGE }}
      SEMGREP_IMAGE: ${{ steps.pins.outputs.SEMGREP_IMAGE }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: 📥 Checkout reviewed pin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e61b85b0c31bc0dc1d526f43eb5ee158a512c3be
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🔐 Prepare reviewed scanner pin helper
        id: scanner_helper
        uses: PiesP/browser-core/automation/actions/prepare-scanner-pins@4ab0442d8d2e3cf640767b499b6444c92f6479b5

      - name: 🔐 Export validated scanner images
        id: pins
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          pin_metadata="$pinned_dir/pinned-tools.json"
          install -m 0600 scripts/ci/pinned-tools.json "$pin_metadata"
          GITHUB_ENV="$GITHUB_OUTPUT" node --experimental-strip-types "${{ steps.scanner_helper.outputs.helper-path }}" env "$pin_metadata"

  changes:
    name: Classify security changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      osv: ${{ steps.scope.outputs.osv }}
      semgrep: ${{ steps.scope.outputs.semgrep }}
      codeql_actions: ${{ steps.scope.outputs.codeql_actions }}
      codeql_javascript: ${{ steps.scope.outputs.codeql_javascript }}
      pinned_tools: ${{ steps.scope.outputs.pinned_tools }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: 📥 Checkout change history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup classifier runtime
        id: runtime
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: Classify changed paths
        id: scope
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.ts"
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
                ! git show "$BASE_SHA:scripts/ci/classify-workflow-changes.ts" > "$classifier"; then
                classifier=
              fi
              ;;
          esac

          if [[ "$CHECKOUT_OUTCOME" == "success" && "$RUNTIME_OUTCOME" == "success" && -n "$classifier" ]] &&
            node --experimental-strip-types "$classifier"; then
            exit 0
          fi

          echo "Change classification failed; enabling every security scope." >&2
          for scope in all quality unit core e2e build osv semgrep codeql_actions codeql_javascript pinned_tools; do
            echo "$scope=true" >> "$GITHUB_OUTPUT"
          done

  pinned-tools:
    name: 🔄 Pinned tool freshness
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e61b85b0c31bc0dc1d526f43eb5ee158a512c3be
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🔐 Prepare reviewed scanner pin helper
        id: scanner_helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-scanner-pins@4ab0442d8d2e3cf640767b499b6444c92f6479b5

      - name: 🔎 Check pinned tools after the cooling window
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          pin_metadata="$pinned_dir/pinned-tools.json"
          install -m 0600 scripts/ci/pinned-tools.json "$pin_metadata"
          node --experimental-strip-types "${{ steps.scanner_helper.outputs.helper-path }}" check "$pin_metadata"

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.pinned_tools != 'true' }}
        run: echo "Pinned-tool inputs are unchanged; the freshness job succeeds without network checks."

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout PR result and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: ⏪ Checkout the trusted PR base
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-old overlay

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-new overlay

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-pr overlay

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv == 'true')) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv != 'true' }}
        run: echo "Dependency inputs are unchanged; the required OSV check succeeds without scanning."

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout target and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: 🔒 Select trusted OSV runtime manifest
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          POLICY_SHA: ${{ github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git cat-file -e "$POLICY_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git cat-file -e "$POLICY_SHA^{commit}"
            git switch --force --detach "$POLICY_SHA"
          else
            [[ "$POLICY_SHA" == "$GITHUB_SHA" ]]
          fi

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: ⏩ Restore target for the full scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-full overlay

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-full overlay

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv == 'true')) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv != 'true' }}
        run: echo "Dependency inputs are unchanged; the required OSV check succeeds without scanning."

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && !((matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true')) }}
        run: echo "${{ matrix.language }} inputs are unchanged; CodeQL initialization is skipped."

  semgrep:
    name: pr-gate/semgrep
    needs: [changes, pin-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: write
    container:
      image: ${{ needs['pin-metadata'].outputs.SEMGREP_IMAGE || 'invalid@@' }}
    steps:
      - name: Prepare remediated Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        id: semgrep-scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true' }}
        shell: sh
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              category=semgrep/full
              set -- --config=p/typescript --config=p/javascript --config=p/security-audit --config=p/secrets
              ;;
            push|pull_request|merge_group)
              category=semgrep/secrets
              set -- --config=p/secrets
              ;;
            *)
              echo "Unsupported Semgrep event: $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac

          rm -f semgrep.sarif
          set +e
          semgrep scan "$@" --error --sarif --output=semgrep.sarif .
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "Semgrep failed operationally with exit $scan_status" >&2
            exit "$scan_status"
          fi

          printf 'category=%s\nscanner-status=%s\n' "$category" "$scan_status" >> "$GITHUB_OUTPUT"

      - name: ✅ Validate Semgrep SARIF
        id: semgrep-report
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && steps.semgrep-scan.outcome == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true')) }}
        uses: PiesP/yt-live-chat-overlay/.github/actions/validate-semgrep-sarif@a8172948afb80cbb030216ee6bd5f64bb062c489
        with:
          sarif_path: semgrep.sarif
          category: ${{ steps.semgrep-scan.outputs.category }}
          scanner_status: ${{ steps.semgrep-scan.outputs.scanner-status }}

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && steps.semgrep-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true')) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: ${{ steps.semgrep-report.outputs.category }}

      - name: 🧪 Scan bounded Semgrep finding fixture
        id: semgrep-fixture-scan
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && github.event_name == 'workflow_dispatch') }}
        shell: sh
        run: |
          set -eu
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/semgrep-finding.XXXXXXXX")
          printf '# Scanner fixture; never executed.\neval(input())\n' > "$fixture_dir/source-audit.py"
          set +e
          semgrep scan --config=p/typescript --config=p/javascript --config=p/security-audit --config=p/secrets --error --sarif --output="$fixture_dir/finding.sarif" "$fixture_dir/source-audit.py"
          fixture_status=$?
          set -e
          if [ "$fixture_status" -ne 1 ]; then
            echo "Semgrep finding fixture expected exit 1, got $fixture_status" >&2
            exit 2
          fi
          printf 'report-path=%s\n' "$fixture_dir/finding.sarif" >> "$GITHUB_OUTPUT"

      - name: ✅ Validate bounded Semgrep finding
        id: semgrep-fixture-report
        if: ${{ steps.node_trust.outcome == 'success' && (!cancelled() && github.event_name == 'workflow_dispatch' && steps.semgrep-fixture-scan.outcome == 'success') }}
        continue-on-error: true
        uses: PiesP/yt-live-chat-overlay/.github/actions/validate-semgrep-sarif@a8172948afb80cbb030216ee6bd5f64bb062c489
        with:
          sarif_path: ${{ steps.semgrep-fixture-scan.outputs.report-path }}
          category: semgrep/full
          scanner_status: '1'

      - name: 🧪 Exercise findings upload guard
        id: semgrep-fixture-upload-guard
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && steps.semgrep-fixture-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true') }}
        shell: sh
        env:
          REPORT_OUTCOME: ${{ steps.semgrep-fixture-report.outcome }}
          REPORT_CATEGORY: ${{ steps.semgrep-fixture-report.outputs.category }}
        run: |
          set -eu
          test "$REPORT_OUTCOME" = failure
          test "$REPORT_CATEGORY" = semgrep/full

      - name: ✅ Require bounded finding regression
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: sh
        env:
          SCAN_OUTCOME: ${{ steps.semgrep-fixture-scan.outcome }}
          REPORT_OUTCOME: ${{ steps.semgrep-fixture-report.outcome }}
          GUARD_OUTCOME: ${{ steps.semgrep-fixture-upload-guard.outcome }}
        run: |
          set -eu
          test "$SCAN_OUTCOME" = success
          test "$REPORT_OUTCOME" = failure
          test "$GUARD_OUTCOME" = success

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.semgrep != 'true' }}
        run: echo "Scannable inputs are unchanged; the required Semgrep check succeeds without scanning."

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs:
      [pinned-tools, osv-scan-pr, osv-scan-dispatch, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          PINNED_TOOLS_RESULT: ${{ needs.pinned-tools.result }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-dispatch.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Pinned tool freshness | $PINNED_TOOLS_RESULT |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_success "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            merge_group)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            push|schedule)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            workflow_dispatch)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
