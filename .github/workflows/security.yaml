name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch: pinned-tool freshness + OSV full scan + CodeQL + Semgrep secrets
# - PR/merge queue: OSV gate + CodeQL + Semgrep secrets
# - PR gate: OSV diff scan; merge queue: full OSV scan
# - Scheduled/manual diagnostics: pinned-tool freshness, full OSV scan, and full Semgrep SARIF
#
# Full Semgrep source analysis runs on the weekly schedule or manually; the
# required PR check retains secrets coverage on every relevant change.
#
# Trigger: Push/PR to master + merge queue + weekly schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * 0" # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-metadata:
    name: Resolve reviewed scanner images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      OSV_SCANNER_IMAGE: ${{ steps.pins.outputs.OSV_SCANNER_IMAGE }}
      SEMGREP_IMAGE: ${{ steps.pins.outputs.SEMGREP_IMAGE }}
    steps:
      - name: 📥 Checkout reviewed pin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 83364ae1027cf6b1761a91dcb855ea9a95c8886c
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔐 Export validated scanner images
        id: pins
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          GITHUB_ENV="$GITHUB_OUTPUT" node --experimental-strip-types "$pinned_dir/pinned-tools.ts" env

  changes:
    name: Classify security changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      osv: ${{ steps.scope.outputs.osv }}
      semgrep: ${{ steps.scope.outputs.semgrep }}
      codeql_actions: ${{ steps.scope.outputs.codeql_actions }}
      codeql_javascript: ${{ steps.scope.outputs.codeql_javascript }}
      pinned_tools: ${{ steps.scope.outputs.pinned_tools }}
    steps:
      - name: 📥 Checkout change history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup classifier runtime
        id: runtime
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Classify changed paths
        id: scope
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-workflow-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-workflow-changes.ts"
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
                ! git show "$BASE_SHA:scripts/ci/classify-workflow-changes.ts" > "$classifier"; then
                classifier=
              fi
              ;;
          esac

          if [[ "$CHECKOUT_OUTCOME" == "success" && "$RUNTIME_OUTCOME" == "success" && -n "$classifier" ]] &&
            node --experimental-strip-types "$classifier"; then
            exit 0
          fi

          echo "Change classification failed; enabling every security scope." >&2
          for scope in all quality unit core e2e build osv semgrep codeql_actions codeql_javascript pinned_tools deep_fast; do
            echo "$scope=true" >> "$GITHUB_OUTPUT"
          done

  pinned-tools:
    name: 🔄 Pinned tool freshness
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 83364ae1027cf6b1761a91dcb855ea9a95c8886c
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔎 Check pinned tools after the cooling window
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.pinned_tools == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          node --experimental-strip-types "$pinned_dir/check-pinned-tools.ts"

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.pinned_tools != 'true' }}
        run: echo "Pinned-tool inputs are unchanged; the freshness job succeeds without network checks."

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout PR result and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: ⏪ Checkout the trusted PR base
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-old overlay

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-new overlay

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-pr overlay

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv == 'true') }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv != 'true' }}
        run: echo "Dependency inputs are unchanged; the required OSV check succeeds without scanning."

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout target and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: 🔒 Select trusted OSV runtime manifest
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          POLICY_SHA: ${{ github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git cat-file -e "$POLICY_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git cat-file -e "$POLICY_SHA^{commit}"
            git switch --force --detach "$POLICY_SHA"
          else
            [[ "$POLICY_SHA" == "$GITHUB_SHA" ]]
          fi

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: ⏩ Restore target for the full scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-full overlay

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv == 'true' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-full overlay

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv == 'true') }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv != 'true' }}
        run: echo "Dependency inputs are unchanged; the required OSV check succeeds without scanning."

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        if: ${{ needs.changes.result != 'success' || (matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true') }}
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && !((matrix.language == 'actions' && needs.changes.outputs.codeql_actions == 'true') || (matrix.language == 'javascript-typescript' && needs.changes.outputs.codeql_javascript == 'true')) }}
        run: echo "${{ matrix.language }} inputs are unchanged; CodeQL initialization is skipped."

  semgrep:
    name: pr-gate/semgrep
    needs: [changes, pin-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      security-events: write
    container:
      image: ${{ needs['pin-metadata'].outputs.SEMGREP_IMAGE || 'invalid@@' }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        id: semgrep-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true' }}
        shell: sh
        run: |
          set -eu
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              category=semgrep/full
              set -- --config=p/typescript --config=p/javascript --config=p/security-audit --config=p/secrets
              ;;
            push|pull_request|merge_group)
              category=semgrep/secrets
              set -- --config=p/secrets
              ;;
            *)
              echo "Unsupported Semgrep event: $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac

          rm -f semgrep.sarif
          set +e
          semgrep scan "$@" --error --sarif --output=semgrep.sarif .
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "Semgrep failed operationally with exit $scan_status" >&2
            exit "$scan_status"
          fi

          python3 - "$category" "$scan_status" <<'PY'
          import json
          import pathlib
          import sys

          category, scan_status = sys.argv[1], int(sys.argv[2])
          path = pathlib.Path('semgrep.sarif')
          try:
              report = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(report, dict) or report.get('version') != '2.1.0':
                  raise ValueError('expected SARIF 2.1.0')
              runs = report.get('runs')
              if not isinstance(runs, list) or not runs:
                  raise ValueError('expected at least one SARIF run')
              result_count = 0
              for run in runs:
                  if not isinstance(run, dict):
                      raise ValueError('invalid SARIF run')
                  tool = run.get('tool')
                  if not isinstance(tool, dict):
                      raise ValueError('missing SARIF tool')
                  driver = tool.get('driver')
                  if not isinstance(driver, dict) or not isinstance(driver.get('name'), str) or not driver['name']:
                      raise ValueError('missing SARIF tool name')
                  rules = driver.get('rules')
                  if driver['name'] != 'Semgrep OSS' or not isinstance(rules, list) or not rules:
                      raise ValueError('unexpected Semgrep SARIF tool or rules')
                  rule_ids = {rule.get('id') for rule in rules if isinstance(rule, dict)}
                  if len(rule_ids) != len(rules) or any(not isinstance(rule_id, str) or not rule_id for rule_id in rule_ids):
                      raise ValueError('invalid SARIF rules')
                  results = run.get('results')
                  if not isinstance(results, list) or any(
                      not isinstance(result, dict)
                      or result.get('ruleId') not in rule_ids
                      or not isinstance(result.get('message'), dict)
                      or not isinstance(result['message'].get('text'), str)
                      for result in results
                  ):
                      raise ValueError('invalid SARIF results')
                  invocations = run.get('invocations')
                  if not isinstance(invocations, list) or not invocations:
                      raise ValueError('missing SARIF invocation')
                  for invocation in invocations:
                      if not isinstance(invocation, dict) or invocation.get('executionSuccessful') is not True:
                          raise ValueError('unsuccessful SARIF invocation')
                      notifications = invocation.get('toolExecutionNotifications', [])
                      if not isinstance(notifications, list) or any(
                          not isinstance(notification, dict) or notification.get('level') == 'error'
                          for notification in notifications
                      ):
                          raise ValueError('SARIF tool execution error')
                  result_count += len(results)
                  details = run.get('automationDetails')
                  if details is not None and not isinstance(details, dict):
                      raise ValueError('invalid SARIF automation details')
                  run['automationDetails'] = {**(details or {}), 'id': f'{category}/'}
              if scan_status == 1 and result_count == 0:
                  raise ValueError('findings exit without SARIF results')
              if scan_status == 0 and result_count != 0:
                  raise ValueError('clean exit with SARIF results under --error')
              path.write_text(json.dumps(report), encoding='utf-8')
          except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError) as error:
              print(f'Invalid Semgrep SARIF: {error}', file=sys.stderr)
              sys.exit(2)
          PY

          printf 'sarif-upload=true\ncategory=%s\n' "$category" >> "$GITHUB_OUTPUT"
          exit "$scan_status"

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ !cancelled() && steps.semgrep-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.semgrep == 'true') }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: ${{ steps.semgrep-report.outputs.category }}

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.semgrep != 'true' }}
        run: echo "Scannable inputs are unchanged; the required Semgrep check succeeds without scanning."

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs:
      [pinned-tools, osv-scan-pr, osv-scan-dispatch, codeql, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Summarize and validate event-specific scans
        env:
          EVENT_NAME: ${{ github.event_name }}
          PINNED_TOOLS_RESULT: ${{ needs.pinned-tools.result }}
          OSV_PR_RESULT: ${{ needs.osv-scan-pr.result }}
          OSV_FULL_RESULT: ${{ needs.osv-scan-dispatch.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          {
            echo "## Security scan results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Pinned tool freshness | $PINNED_TOOLS_RESULT |"
            echo "| OSV PR diff | $OSV_PR_RESULT |"
            echo "| OSV full | $OSV_FULL_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          expect_success() {
            local label="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "Expected $label to succeed for $EVENT_NAME, got: $result" >&2
              failed=1
            fi
          }

          expect_success "CodeQL" "$CODEQL_RESULT"
          expect_success "Semgrep" "$SEMGREP_RESULT"
          case "$EVENT_NAME" in
            pull_request)
              expect_success "OSV PR diff" "$OSV_PR_RESULT"
              ;;
            merge_group)
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            push|schedule)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            workflow_dispatch)
              expect_success "pinned tool freshness" "$PINNED_TOOLS_RESULT"
              expect_success "OSV full" "$OSV_FULL_RESULT"
              ;;
            *)
              echo "Unsupported security workflow event: $EVENT_NAME" >&2
              failed=1
              ;;
          esac

          exit "$failed"
