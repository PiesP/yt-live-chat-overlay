name: 🔬 Deep Verification

# Responsibility: expensive checks that should not block quick PR feedback
# - Fast mutation testing on the weekly schedule or on demand
# - Duplication checking on the weekly schedule or on demand
# - Broader renderer mutation testing on the weekly schedule or on demand
#
# Manual runs can select one check to conserve Actions minutes and runner
# concurrency when investigating a single gate.

# Security: All third-party actions pinned to full commit SHAs.

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run all deep checks or one selected gate"
        required: true
        default: all
        type: choice
        options:
          - all
          - mutation-fast
          - mutation-renderer
          - duplication

env:
  NODE_VERSION: "26"

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication:
    name: 🔍 Duplication
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' ||
      inputs.scope == 'duplication') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🔧 Install nose
        run: bash scripts/ci/install-nose.sh

      - name: 🔎 Check for new duplication
        run: nose query src --baseline .nose-baseline.json --fail-on new

  changes:
    name: Classify deep-verification changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deep_fast: ${{ steps.scope.outputs.deep_fast }}
    steps:
      - name: 📥 Checkout change history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Classify changed paths
        id: scope
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$CHECKOUT_OUTCOME" == "success" ]] && scripts/ci/classify-workflow-changes.sh; then
            exit 0
          fi

          echo "Change classification failed; enabling fast mutation." >&2
          echo "deep_fast=true" >> "$GITHUB_OUTPUT"

  mutation-fast:
    name: 🧬 Fast mutation
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.scope == 'all' ||
      inputs.scope == 'mutation-fast') }}
    runs-on: ubuntu-24.04
    # The semantic fast profile takes ~22 minutes on GitHub-hosted runners.
    # Keep enough headroom for normal runner variance without reducing scope.
    timeout-minutes: 35
    steps:
      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.deep_fast == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Set up project
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.deep_fast == 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@5fd4c8e8d0d84d8d46dd7b71b996d1664365f6d6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧬 Run fast mutation gate
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.deep_fast == 'true' }}
        run: pnpm mut:fast

      - name: 📤 Upload fast mutation report
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.deep_fast == 'true') && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-mutation-report-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: No relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.deep_fast != 'true' }}
        run: echo "Fast-mutation inputs are unchanged; mutation testing is skipped."

  mutation-renderer:
    name: 🎨 Renderer mutation
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_dispatch' ||
      inputs.scope == 'all' || inputs.scope == 'mutation-renderer') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Set up project
        uses: PiesP/browser-core/automation/actions/setup-project@5fd4c8e8d0d84d8d46dd7b71b996d1664365f6d6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🎨 Run renderer mutation gate
        run: pnpm mut:renderer

      - name: 📤 Upload renderer mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-mutation-report
          path: reports/mutation/renderer.json
          if-no-files-found: warn
          retention-days: 7
