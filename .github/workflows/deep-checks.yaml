name: 🔬 Deep Verification

# Responsibility: expensive checks that should not block quick PR feedback
# - Fast mutation testing on integrated master
# - Broader renderer mutation testing on the weekly schedule or on demand
#
# Manual runs can select one check to conserve Actions minutes and runner
# concurrency when investigating a single gate.

# Security: All third-party actions pinned to full commit SHAs.

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run all deep checks or one selected gate"
        required: true
        default: all
        type: choice
        options:
          - all
          - mutation-fast
          - mutation-renderer

env:
  NODE_VERSION: "26"

permissions:
  contents: read

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-fast:
    name: 🧬 Fast mutation
    if: >-
      ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' ||
      inputs.scope == 'mutation-fast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧬 Run fast mutation gate
        run: pnpm mut:fast

  mutation-renderer:
    name: 🎨 Renderer mutation
    if: >-
      ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' ||
      inputs.scope == 'all' || inputs.scope == 'mutation-renderer') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Run renderer mutation gate
        run: pnpm mut:renderer

      - name: 📤 Upload renderer mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-mutation-report
          path: reports/mutation/renderer.json
          if-no-files-found: warn
          retention-days: 7
