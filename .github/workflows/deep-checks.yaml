name: 🔬 Deep Verification

# Responsibility: expensive code analysis on the weekly schedule or on demand.
# Successful results may be reused only for identical tracked inputs and gate identity.
# Security intelligence and external compatibility checks have separate workflows.
# Manual runs rerun by default and can opt in to successful-result reuse.
# Security: All third-party actions pinned to full commit SHAs.

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run all deep checks or one selected gate"
        required: true
        default: all
        type: choice
        options:
          - all
          - mutation-fast
          - mutation-renderer
          - duplication
      reuse_success:
        description: "Reuse a prior successful result for identical inputs"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication:
    name: 🔍 Duplication
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'duplication' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🔑 Fingerprint duplication inputs
        id: fingerprint
        continue-on-error: true
        env:
          DEEP_RUNNER_LABEL: ubuntu-24.04
        run: node scripts/ci/deep-check-reuse.mjs fingerprint duplication

      - name: 📥 Restore successful duplication marker
        id: restore
        if: ${{ steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/duplication.json
          key: deep-success-v2-duplication-${{ steps.fingerprint.outputs.fingerprint }}

      - name: 🔎 Validate successful duplication marker
        id: marker
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSE_SUCCESS: ${{ inputs.reuse_success }}
        run: node scripts/ci/deep-check-reuse.mjs verify duplication "$FINGERPRINT" .deep-check-cache/duplication.json

      - name: ♻️ Reuse successful duplication
        if: ${{ steps.marker.outputs.reuse == 'true' }}
        run: |
          echo 'Duplication: reused a successful result for identical inputs.' >> "$GITHUB_STEP_SUMMARY"

      - name: 🔧 Install nose
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: bash scripts/ci/install-nose.sh

      - name: 🔎 Check for new duplication
        id: check
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: nose query src --baseline .nose-baseline.json --fail-on new

      - name: ✅ Record fresh duplication pass
        if: ${{ steps.check.outcome == 'success' }}
        run: |
          echo 'Duplication: passed a fresh analysis.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Mark successful duplication
        id: mark
        if: ${{ steps.check.outcome == 'success' && steps.fingerprint.outputs.cacheable == 'true' && steps.restore.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: node scripts/ci/deep-check-reuse.mjs mark duplication "$FINGERPRINT" .deep-check-cache/duplication.json

      - name: 💾 Save successful duplication marker
        if: ${{ steps.mark.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/duplication.json
          key: deep-success-v2-duplication-${{ steps.fingerprint.outputs.fingerprint }}

  mutation-fast:
    name: 🧬 Fast mutation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'mutation-fast' }}
    runs-on: ubuntu-24.04
    # The semantic fast profile takes ~22 minutes on GitHub-hosted runners.
    # Keep enough headroom for normal runner variance without reducing scope.
    timeout-minutes: 35
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🔑 Fingerprint fast mutation inputs
        id: fingerprint
        continue-on-error: true
        env:
          DEEP_RUNNER_LABEL: ubuntu-24.04
        run: node scripts/ci/deep-check-reuse.mjs fingerprint mutation-fast

      - name: 📥 Restore successful fast mutation marker
        id: restore
        if: ${{ steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation-fast.json
          key: deep-success-v2-mutation-fast-${{ steps.fingerprint.outputs.fingerprint }}

      - name: 🔎 Validate successful fast mutation marker
        id: marker
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSE_SUCCESS: ${{ inputs.reuse_success }}
        run: node scripts/ci/deep-check-reuse.mjs verify mutation-fast "$FINGERPRINT" .deep-check-cache/mutation-fast.json

      - name: ♻️ Reuse successful fast mutation
        if: ${{ steps.marker.outputs.reuse == 'true' }}
        run: |
          echo 'Fast mutation: reused a successful result for identical inputs.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Set up project
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@b382fa99a8b8ed5570ab6f4e1fd065a1423ea3f2

      - name: 🧬 Run fast mutation gate
        id: check
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: pnpm mut:fast

      - name: 📤 Upload fast mutation report
        id: upload
        if: ${{ steps.check.outcome != 'skipped' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-mutation-report-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: ✅ Record fresh fast mutation pass
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' }}
        run: |
          echo 'Fast mutation: passed a fresh analysis and uploaded its report.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Mark successful fast mutation
        id: mark
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' && steps.fingerprint.outputs.cacheable == 'true' && steps.restore.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: node scripts/ci/deep-check-reuse.mjs mark mutation-fast "$FINGERPRINT" .deep-check-cache/mutation-fast.json

      - name: 💾 Save successful fast mutation marker
        if: ${{ steps.mark.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation-fast.json
          key: deep-success-v2-mutation-fast-${{ steps.fingerprint.outputs.fingerprint }}

  mutation-renderer:
    name: 🎨 Renderer mutation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'mutation-renderer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🔑 Fingerprint renderer mutation inputs
        id: fingerprint
        continue-on-error: true
        env:
          DEEP_RUNNER_LABEL: ubuntu-24.04
        run: node scripts/ci/deep-check-reuse.mjs fingerprint mutation-renderer

      - name: 📥 Restore successful renderer mutation marker
        id: restore
        if: ${{ steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation-renderer.json
          key: deep-success-v2-mutation-renderer-${{ steps.fingerprint.outputs.fingerprint }}

      - name: 🔎 Validate successful renderer mutation marker
        id: marker
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSE_SUCCESS: ${{ inputs.reuse_success }}
        run: node scripts/ci/deep-check-reuse.mjs verify mutation-renderer "$FINGERPRINT" .deep-check-cache/mutation-renderer.json

      - name: ♻️ Reuse successful renderer mutation
        if: ${{ steps.marker.outputs.reuse == 'true' }}
        run: |
          echo 'Renderer mutation: reused a successful result for identical inputs.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Set up project
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@b382fa99a8b8ed5570ab6f4e1fd065a1423ea3f2

      - name: 🎨 Run renderer mutation gate
        id: check
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: pnpm mut:renderer

      - name: 📤 Upload renderer mutation report
        id: upload
        if: ${{ steps.check.outcome != 'skipped' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-mutation-report-${{ github.sha }}
          path: reports/mutation/renderer.json
          if-no-files-found: error
          retention-days: 7

      - name: ✅ Record fresh renderer mutation pass
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' }}
        run: |
          echo 'Renderer mutation: passed a fresh analysis and uploaded its report.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Mark successful renderer mutation
        id: mark
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' && steps.fingerprint.outputs.cacheable == 'true' && steps.restore.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: node scripts/ci/deep-check-reuse.mjs mark mutation-renderer "$FINGERPRINT" .deep-check-cache/mutation-renderer.json

      - name: 💾 Save successful renderer mutation marker
        if: ${{ steps.mark.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation-renderer.json
          key: deep-success-v2-mutation-renderer-${{ steps.fingerprint.outputs.fingerprint }}
