name: 🚀 Release

# Responsibility: validate and publish tagged releases for userscript and
# browser extensions.
#
# Validation is split into independent jobs so E2E and mutation testing can
# run concurrently. The publish job has the only write permissions and starts
# only after every validation job succeeds.
#
# Trigger: Manual dispatch from protected master for an existing v* tag.

# Security: All third-party actions pinned to full commit SHAs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) contained in protected master
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  provenance:
    name: 🔐 Verify protected release source
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.verify.outputs.release-sha }}
      version: ${{ steps.verify.outputs.version }}
      node-version: ${{ steps.verify.outputs.node-version }}
    steps:
      - name: 📥 Checkout protected workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 🔐 Verify tag belongs to protected master
        id: verify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid release tag: $RELEASE_TAG (expected vX.Y.Z)"
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo "❌ Release tag $RELEASE_TAG is not contained in protected master $GITHUB_SHA"
            exit 1
          fi
          latest_release_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_release_tag="$candidate"
              break
            fi
          done < <(git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-version:refname)
          if [[ -z "$latest_release_tag" ]]; then
            echo "❌ Protected master has no stable release tag"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$latest_release_tag" ]]; then
            echo "❌ Release tag $RELEASE_TAG is not the latest stable tag on protected master ($latest_release_tag)"
            exit 1
          fi
          # Resolve from the verified tagged source, including older tags whose
          # locally reviewed setup action still requires node-version input.
          node - "$release_sha" <<'JS'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const manifest = JSON.parse(execFileSync('git', ['show', `${process.argv[2]}:package.json`], { encoding: 'utf8' }));
          const version = manifest.volta?.node;
          if (typeof version !== 'string' || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Release source must declare an exact volta.node pin');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `node-version=${version}\n`);
          JS
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  quality:
    name: ✅ Release quality
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Set up release project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: ✅ Run quality gate
        run: pnpm quality

  unit:
    name: 🧪 Release unit + coverage
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Set up release project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🧪 Run unit tests and coverage thresholds
        run: pnpm test:cov

  e2e:
    name: 🎭 Release E2E
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Set up release project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🎭 Run E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium firefox
          pnpm test:e2e

  duplication:
    name: 🔍 Release duplication
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: 📦 Setup protected pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 🔧 Install nose
        run: |
          set -euo pipefail
          trusted_sha=9f040ccfd72528f683f898a4b31e94a21f5913b7
          git cat-file -e "$trusted_sha^{commit}"
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            git show "$trusted_sha:scripts/ci/$name" > "$pinned_dir/$name"
            chmod 0600 "$pinned_dir/$name"
          done
          node --experimental-strip-types "$pinned_dir/install-nose.ts"

      - name: 🔎 Check for new duplication
        run: nose query src --baseline .nose-baseline.json --fail-on new

  mutation:
    name: 🧬 Release mutation
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Set up release project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🧬 Run mutation gate
        run: pnpm mut:fast

  build:
    name: 🏗️ Build release package
    needs: [provenance, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          fetch-tags: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Set up release project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 📝 Determine version
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "❌ Tag version $VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
          echo "📦 Release version: $VERSION"

      - name: 🏗️ Build all targets
        env:
          BUILD_VERSION: ${{ needs.provenance.outputs.version }}
        run: pnpm build:all:ci

      - name: 📦 Prepare release metadata
        env:
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: pnpm release:prepare

      - name: 📊 Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  publish:
    name: 🏷️ Publish GitHub Release
    needs: [provenance, quality, unit, e2e, duplication, mutation, build]
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle

      - name: 🔐 Prevent release channel rollback
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/latest-release.json"
          http_status="$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"
          if [[ "$http_status" == "404" ]]; then
            exit 0
          fi
          if [[ "$http_status" != "200" ]]; then
            echo "❌ Failed to read the latest published release (HTTP $http_status)"
            exit 1
          fi
          latest_published_tag="$(jq -er '.tag_name | strings' "$response_file")"
          if ! [[ "$latest_published_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Latest published release has an unsupported tag: $latest_published_tag"
            exit 1
          fi
          newest_tag="$(printf '%s\n%s\n' "$latest_published_tag" "$RELEASE_TAG" | sort -V | tail -n 1)"
          if [[ "$newest_tag" != "$RELEASE_TAG" ]]; then
            echo "❌ Refusing to move the latest release from $latest_published_tag back to $RELEASE_TAG"
            exit 1
          fi

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-bundle/release/RELEASE_NOTES.md
          files: |
            release-bundle/release/yt-live-chat-overlay.user.js
            release-bundle/release/yt-live-chat-overlay.meta.js
            release-bundle/release/yt-live-chat-overlay-chrome.zip
            release-bundle/release/yt-live-chat-overlay-firefox.zip
            release-bundle/release/checksums.txt
            release-bundle/release/metadata.json
          draft: false
          prerelease: false
          make_latest: legacy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
