name: Codex Security advisory scan

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CODEX_SECURITY_VERSION: "0.1.8"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.14"

jobs:
  advisory-scan:
    name: Codex Security advisory scan
    if: >-
      ${{ vars.CODEX_SECURITY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned Codex Security CLI outside the checkout
        env:
          CLI_DIR: ${{ runner.temp }}/codex-security-cli/${{ env.CODEX_SECURITY_VERSION }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$CLI_DIR"
          npm install \
            --prefix "$CLI_DIR" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            "@openai/codex-security@$CODEX_SECURITY_VERSION"
          CODEX_SECURITY_BIN="$CLI_DIR/node_modules/.bin/codex-security"
          test -x "$CODEX_SECURITY_BIN"
          "$CODEX_SECURITY_BIN" --version

      - name: Check out the exact target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Prepare private scan directories
        run: |
          set -euo pipefail
          install -d -m 0700 \
            "$RUNNER_TEMP/codex-security-state" \
            "$RUNNER_TEMP/codex-security-results"

      - name: Run advisory scan
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_STATE_DIR: ${{ runner.temp }}/codex-security-state
          CLI: ${{ runner.temp }}/codex-security-cli/${{ env.CODEX_SECURITY_VERSION }}/node_modules/.bin/codex-security
          OUTPUT_DIR: ${{ runner.temp }}/codex-security-results
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          common=(
            scan "$GITHUB_WORKSPACE"
            --output-dir "$OUTPUT_DIR"
            --knowledge-base "$GITHUB_WORKSPACE/.github/codex-security/threat-model.md"
            --knowledge-base "$GITHUB_WORKSPACE/.github/SECURITY.md"
            --knowledge-base "$GITHUB_WORKSPACE/PRIVACY.md"
            --scan-prompt-file "$GITHUB_WORKSPACE/.github/codex-security/scan.md"
            --auth api-key
            --headless
            --json
          )

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git cat-file -e "$BASE_SHA^{commit}"
            git cat-file -e "$HEAD_SHA^{commit}"
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            "$CLI" "${common[@]}" \
              --diff "$MERGE_BASE" \
              --head "$HEAD_SHA" \
              --max-cost 5 \
              > "$RUNNER_TEMP/codex-security-result.json"
          else
            "$CLI" "${common[@]}" \
              --mode standard \
              --max-cost 8 \
              > "$RUNNER_TEMP/codex-security-result.json"
          fi

      - name: Export SARIF
        id: export
        if: ${{ !cancelled() }}
        env:
          CLI: ${{ runner.temp }}/codex-security-cli/${{ env.CODEX_SECURITY_VERSION }}/node_modules/.bin/codex-security
          OUTPUT_DIR: ${{ runner.temp }}/codex-security-results
        run: |
          set -euo pipefail
          if [[ ! -f "$OUTPUT_DIR/scan-manifest.json" ]]; then
            echo "No sealed scan manifest is available; skipping SARIF export."
            echo "sarif=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$CLI" export "$OUTPUT_DIR" \
            --export-format sarif \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$OUTPUT_DIR/exports/results.sarif"
          echo "sarif=true" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && steps.export.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: ${{ runner.temp }}/codex-security-results/exports/results.sarif
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          category: codex-security-advisory

      - name: Upload private scan artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codex-security-results/
            ${{ runner.temp }}/codex-security-result.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
