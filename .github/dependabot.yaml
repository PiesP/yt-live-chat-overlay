version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Cooldown: wait 7 days after a package is released before creating a PR.
    # This mitigates supply-chain attacks where malicious packages are typically
    # detected and removed within days of publication.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"

    rebase-strategy: "auto"

    # Keep normal updates to direct dependencies; security updates remain
    # governed by the OSV and Dependabot security-update paths.
    allow:
      - dependency-type: "direct"

    groups:
      build:
        patterns:
          - "typescript"
          - "vite"
          - "vite-plugin-monkey"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      quality:
        patterns:
          - "@biomejs/*"
          - "knip"
          - "rimraf"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Cooldown: wait 7 days after a package is released before creating a PR.
    # This mitigates supply-chain attacks where malicious packages are typically
    # detected and removed within days of publication.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
    # pnpm/action-setup@v6 has a known bug (pnpm/action-setup#225) that always
    # installs pnpm v11 beta, ignoring the packageManager field. Skip major
    # upgrades until the bug is resolved upstream.
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types: ["version-update:semver-major"]
