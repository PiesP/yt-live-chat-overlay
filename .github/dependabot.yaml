version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine dependency review once per week; security alerts remain
    # visible through the normal advisory and scanner paths.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"

    rebase-strategy: "auto"

    # Keep normal updates to direct dependencies; security updates remain
    # governed by the OSV and Dependabot security-update paths.
    allow:
      - dependency-type: "direct"

    # Vite+ owns these versions. Normal updates use its reviewed migration flow;
    # version-update filters do not disable Dependabot security updates.
    ignore:
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@vitest/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@voidzero-dev/vite-plus-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      vite-plus:
        patterns:
          - "vite-plus"
        update-types:
          - "minor"
          - "patch"

      build:
        patterns:
          - "typescript"
          - "vite-plugin-monkey"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      quality:
        patterns:
          - "@biomejs/biome"
          - "knip"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-release"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine Actions review once per week; urgent fixes can still be
    # requested manually or through security advisories.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      pnpm-setup:
        patterns:
          - "pnpm/action-setup"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
          - "pnpm/action-setup"
