version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine dependency review once per week; security alerts remain
    # visible through the normal advisory and scanner paths.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"

    rebase-strategy: "auto"

    # Keep normal updates to direct dependencies; security updates remain
    # governed by the OSV and Dependabot security-update paths.
    allow:
      - dependency-type: "direct"

    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

      stryker:
        patterns:
          - "@stryker-mutator/*"
        update-types:
          - "minor"
          - "patch"

      build:
        patterns:
          - "typescript"
          - "vite"
          - "vite-plugin-monkey"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      quality:
        patterns:
          - "@biomejs/*"
          - "knip"
        update-types:
          - "minor"
          - "patch"

  # Codex Security CLI and its integrity-locked npm closure
  - package-ecosystem: "npm"
    directory: "/scripts/security/codex-security"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps-security)"
    reviewers:
      - "PiesP"
    labels:
      - "dependencies"
      - "automated"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine Actions review once per week; urgent fixes can still be
    # requested manually or through security advisories.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
