name: Setup release project
description: Resolve the checked-out runtime and install through the shared Vite+ setup

inputs:
  node-version:
    description: Verified source pin, checked against the current .node-version
    required: false

runs:
  using: composite
  steps:
    - name: Resolve the checked-out runtime
      id: runtime
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: node "$GITHUB_ACTION_PATH/resolve-runtime.mjs"

    - name: Install the Vite+ runtime and locked dependencies
      uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
      with:
        node-version: ${{ steps.runtime.outputs.version }}
