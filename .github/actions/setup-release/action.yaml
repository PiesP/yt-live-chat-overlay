name: Setup release project
description: Install the pinned release toolchain and frozen dependency graph

inputs:
  node-version:
    description: Node.js version passed to pnpm/setup
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        package-json-file: package.json
        runtime: "node@${{ inputs.node-version }}"
        cache: true
        install: false

    - name: Install frozen release dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --no-runtime
