<!-- Reduced from the prepared Windows Edge failurePlayerDom capture for public video jfKfPfyJRdk, 2026-10-17. -->
<div id="player">
  <yt-playability-error-supported-renderers id="error-screen">
    <div id="container">
      <yt-player-interstitial-renderer role="dialog">
        <div class="playerInterstitialRendererScrim">
          <yt-interstitial-view-model class="interstitialViewModelHost interstitialViewModelErrorScreenRedesignEnabled">
            <div class="interstitialViewModelModelContainer">
              <div class="interstitialViewModelTextTitle"><span role="text">Video unavailable</span></div>
              <div class="interstitialViewModelTextDescription"><span role="text">This live stream recording is not available.</span></div>
            </div>
          </yt-interstitial-view-model>
        </div>
      </yt-player-interstitial-renderer>
    </div>
  </yt-playability-error-supported-renderers>
</div>
<div id="player-container" style="visibility: hidden">
  <ytd-player><div id="movie_player"><div class="ytp-error" style="display: none"></div><video></video></div></ytd-player>
</div>
