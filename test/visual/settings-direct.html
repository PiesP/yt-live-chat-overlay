<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>YT Chat Overlay — Visual Settings Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .test-header { text-align: center; margin-bottom: 24px; }
    .test-header h1 { font-size: 20px; color: #5e6ad2; margin-bottom: 4px; }
    .test-header p { font-size: 13px; color: #888; }
    .test-header code {
      background: #222;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #aaa;
    }
    #movie_player {
      width: 800px;
      height: 450px;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #555;
      max-width: 800px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="test-header">
    <h1>YT Chat Overlay — Settings UI Test</h1>
    <p>Click the gear icon (&#x2699; bottom-right on player) to open settings</p>
    <p style="margin-top:8px;color:#5e6ad2;">Run via: <code>pnpm serve:test</code> or open this file from the project root</p>
  </div>
  <div id="movie_player" class="html5-video-player"></div>
  <p class="note">
    This test page opens the settings modal directly via dev helpers.
    No need for userscript injection or location spoofing.
  </p>

<script type="module">
  /**
   * Direct Settings UI Test
   *
   * Instead of injecting the full userscript bundle and spoofing location,
   * this test directly imports and renders the SettingsUi module from the source.
   *
   * This requires the test page to be served via Vite dev server which
   * resolves TypeScript source imports. For a standalone test, build with:
   *   pnpm build:dev
   * Then use the Chrome extension dev mode with manifest.json content_scripts.
   */

  // Check if running in dev mode with Vite
  if (import.meta.env && import.meta.env.DEV) {
    console.log('[Test] Dev mode detected — rendering settings UI directly (stub)');
  } else {
    // Production fallback: use the openSettings dev API
    // The YT bundle exposes ytChatOverlay.openSettings when in dev mode
    console.log('[Test] Production mode — settings UI should be opened via browser action or menu');
  }

  // Provide a visible actionable element for testing
  const openBtn = document.createElement('button');
  openBtn.textContent = 'Open Settings (Dev Mode Only)';
  openBtn.id = 'yt-test-open-settings';
  openBtn.style.cssText = 'margin-top:16px;padding:10px 20px;background:#5e6ad2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;';
  document.body.appendChild(openBtn);
</script>
<script src="gm-mocks.js"></script>
<script type="module">
  import { createSettingsApp } from '/src/core/settings-app.ts';
  const app = createSettingsApp({
    isOpen: false,
    onClose: () => {},
    onSettingChange: (key, value) => console.log('[Test] setting change:', key, value),
  });
  app.open();
  console.log('[Test] Settings UI rendered via direct import');
</script>
</body>
</html>
