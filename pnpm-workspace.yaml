overrides:
  # typed-rest-client still permits qs releases affected by a DoS advisory.
  qs@>=6.11.1: ">=6.15.2"
  # postcss still permits nanoid releases affected by GHSA-2v37-7h3g-55p8.
  nanoid@<3.3.18: "3.3.18"

# pnpm 11 blocks dependency build scripts by default. canvas is required by
# the jsdom-based unit and Playwright test environment.
allowBuilds:
  canvas: true

strictDepBuilds: true
blockExoticSubdeps: true
engineStrict: true

# Enforce a 24-hour supply-chain observation window, including registries that
# omit publication timestamps.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
