overrides:
  qs@>=6.11.1: ">=6.15.2"

# pnpm 11 blocks dependency build scripts by default. canvas is required by
# the jsdom-based unit and Playwright test environment.
allowBuilds:
  canvas: true

strictDepBuilds: true
blockExoticSubdeps: true
engineStrict: true

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600

preferFrozenLockfile: true
autoInstallPeers: true
strictPeerDependencies: false
