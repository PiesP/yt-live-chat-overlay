# pnpm 11 blocks dependency build scripts by default. canvas is required by
# the jsdom-based unit and Playwright test environment.
allowBuilds:
  canvas: true

strictDepBuilds: true
blockExoticSubdeps: true
engineStrict: true

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# Enforce a 24-hour supply-chain observation window, including registries that
# omit publication timestamps.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
  "@vitest/coverage-v8": 5.0.4
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
