# pnpm 11 blocks dependency build scripts by default. canvas is required by
# the jsdom-based unit and Playwright test environment.
allowBuilds:
  canvas: true

strictDepBuilds: true
blockExoticSubdeps: true
engineStrict: true
runtimeOnFail: ignore
pmOnFail: ignore

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# The exact managed alias bundles Vite 8.3.5, within these callers' peer ranges.
# Recheck callers, alias and bundled Vite together on each toolchain update.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker@5.0.5>vite": 1.4.0
    "vitest@5.0.5>vite": 1.4.0
    "vite-plugin-monkey@8.1.1>vite": 1.4.0

# Enforce a 24-hour supply-chain observation window, including registries that
# omit publication timestamps.
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  # Only native Firefox BiDi is used; the patched barrel defers the unused CDP mapper.
  "puppeteer-core@25.16.0>chromium-bidi": "-"
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  puppeteer-core@25.16.0: patches/puppeteer-core@25.16.0.patch
